<form [formGroup]="userForm" (ngSubmit)="onSubmit()" class="container mt-5" enctype="multipart/form-data">
  <!-- Nom -->
  <div class="mb-3">
    <label for="nom" class="form-label">Nom :</label>
    <input
      type="text"
      id="nom"
      class="form-control"
      [formControl]="getControl('nom') || null"
    />
    <div *ngIf="getControl('nom')?.invalid && getControl('nom')?.touched" class="text-danger">
      <small *ngIf="getControl('nom')?.errors?.['required']">Le nom est obligatoire.</small>
      <small *ngIf="getControl('nom')?.errors?.['pattern']">
        Le nom doit commencer par une majuscule et ne contenir que des lettres.
      </small>
    </div>
  </div>
  <!-- Prénom -->
  <div class="mb-3">
    <label for="prenom" class="form-label">Prénom :</label>
    <input
      type="text"
      id="prenom"
      class="form-control"
      [formControl]="getControl('prenom')"
    />
    <div *ngIf="getControl('prenom')?.invalid && getControl('prenom')?.touched" class="text-danger">
      <small *ngIf="getControl('prenom')?.errors?.['required']">Le prénom est obligatoire.</small>
      <small *ngIf="getControl('prenom')?.errors?.['pattern']">
        Le prénom doit commencer par une majuscule et ne contenir que des lettres.
      </small>
    </div>
  </div>
  <!-- Rôle -->
  <div class="mb-3">
    <label for="role" class="form-label">Rôle :</label>
    <select
      id="role"
      class="form-select"
      [formControl]="getControl('role')"
    >
      <option value="user">Utilisateur</option>
      <option value="admin">Administrateur</option>
    </select>
    <div *ngIf="getControl('role')?.invalid && getControl('role')?.touched" class="text-danger">
      <small *ngIf="getControl('role')?.errors?.['required']">Le rôle est obligatoire.</small>
    </div>
  </div>

  <!-- Téléphone -->
  <div class="mb-3">
    <label for="telephone" class="form-label">Téléphone</label>
    <input type="number" id="telephone" formControlName="telephone" class="form-control" placeholder="Entrez le téléphone" required />
  </div>
  <!-- Photo de profil -->
  <div class="mb-3">
    <label for="photoProfil" class="form-label">Photo de profil :</label>
    <input
      type="file"
      id="photoProfil"
      class="form-control"
      (change)="onFileSelected($event)"
    />
  </div>
  <!-- Bouton Ajouter -->
  <button
    type="submit"
    class="btn btn-primary w-100"
    [disabled]="userForm.invalid"
  >
    Ajouter
  </button>
</form>
